plans:
  - code: '{{ .plan_code }}'
    name: '{{ .plan_name }}'
    currency: '{{ .currency }}'
    billing_interval: monthly
    base_amount_cents: 0
    meters: [tokens]

dunning:
  policy:
    name: AI default retry
    # Retries on day 3, 4, 7 and 14 after the failed payment: the first
    # waits 3 days, each next one 1, 3 and 7 days after the one before.
    retry_days: [3, 1, 3, 7]
    final_subscription_action: pause
    final_invoice_action: none

webhook:
  events:
    - invoice.finalized
    - invoice.paid
    - payment.failed
    - subscription.item.updated
    - subscription.canceled
  url_placeholder: 'https://example.com/webhooks/velox'
