key: anthropic_style
version: 7.0.0
name: Anthropic (Claude) token pricing
summary: |
  Ready-made pricing for reselling Claude (Anthropic) API access. Bills each
  customer per token — with separate rates for every model and for input,
  output, and cached tokens — on a monthly plan.
description: |
  Sets up everything you need to bill customers for Claude (Anthropic) usage:

    • A usage meter that counts tokens
    • Per-token prices for every Claude model on Anthropic's pricing page
      on 2026-10-22: the current lineup (Fable 5.1, Mythos 5.1, Opus 5.5,
      Sonnet 5.5, Haiku 5.5), the earlier 5 and 4.x models, Haiku 4.5 and
      Haiku 3.5. Older 3.x models are priced at their last published prices
    • Separate rates for input, output, cache reads and cache writes. Cache
      writes cost 1.25x input (5-minute) or 2x input (1-hour). Cache reads
      cost 0.1x input on most models, 0.05x on Opus 5.5 and Sonnet 5.5, and
      0.025x on Fable 5.1 and Mythos 5.1
    • Two sets of Haiku 5.5 prices: one for prompts up to 100,000 tokens,
      and a higher one above that (a prompt counts input, cache reads and
      cache writes)
    • A monthly plan your customers subscribe to
    • Automatic payment retries and a notifications endpoint you can point
      at your own systems

  Prices start at Anthropic's public list rates — a starting point you'll
  edit to your own margins after setup. Before installing, you can set the
  currency and the plan's name.

overridable:
  - key: currency
    type: string
    default: USD
    enum: [USD, EUR, GBP]
  - key: plan_name
    type: string
    default: AI API
    max_length: 80
  - key: plan_code
    type: string
    default: ai_api_pro
    pattern: '^[a-z][a-z0-9_]*$'

meters:
  - key: tokens
    name: Tokens
    unit: tokens
    aggregation: sum

rating_rules:
  # Claude Opus 4.5 — input $5.00 / output $25.00 per million (per-token).
  # Cache multiples as everywhere: read 0.1×, 5m write 1.25×, 1h write 2×.
  - key: opus45_input
    name: Claude Opus 4.5 input
    mode: flat
    currency: '{{ .currency }}'
    flat_amount_cents: '0.0005'
  - key: opus45_output
    name: Claude Opus 4.5 output
    mode: flat
    currency: '{{ .currency }}'
    flat_amount_cents: '0.0025'
  - key: opus45_cache_read
    name: Claude Opus 4.5 cache read
    mode: flat
    currency: '{{ .currency }}'
    flat_amount_cents: '0.00005'
  - key: opus45_cache_write_5m
    name: Claude Opus 4.5 cache write (5m)
    mode: flat
    currency: '{{ .currency }}'
    flat_amount_cents: '0.000625'
  - key: opus45_cache_write_1h
    name: Claude Opus 4.5 cache write (1h)
    mode: flat
    currency: '{{ .currency }}'
    flat_amount_cents: '0.001'

