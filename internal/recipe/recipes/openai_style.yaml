key: openai_style
version: 9.0.0
name: OpenAI (GPT) token pricing
summary: |
  Ready-made pricing for reselling OpenAI (GPT) API access. Bills each
  customer per token — with separate rates for every GPT and embedding
  model and for input, output, and cached tokens — on a monthly plan.
description: |
  Sets up everything you need to bill customers for OpenAI usage:

    • A usage meter that counts tokens
    • Per-token prices for the current GPT-5.x models, the o-series
      reasoning models, the older GPT-4 / 3.5 models, and OpenAI's
      embedding models
    • Separate rates for input, output, and cached input — cached input is
      discounted, matching OpenAI's pricing (OpenAI has no separate
      cache-write fee)
    • A monthly plan your customers subscribe to

  Prices start at OpenAI's public list rates — a starting point you'll edit
  to your own margins after setup. Before installing, you can set the
  currency and the plan's name.

overridable:
  - key: currency
    type: string
    default: USD
    enum: [USD, EUR, GBP]
  - key: plan_name
    type: string
    default: OpenAI-style API
    max_length: 80
  - key: plan_code
    type: string
    default: openai_api_pro
    pattern: '^[a-z][a-z0-9_]*$'

meters:
  - event_name: tokens
    name: Tokens
    unit: tokens
    aggregation: sum

plans:
  - code: '{{ .plan_code }}'
    name: '{{ .plan_name }}'
    currency: '{{ .currency }}'
    billing_interval: monthly
    base_amount_cents: 0
    prices:
      # gpt-5.1 — input $1.25 / output $10 per million; cache read $0.125 (per-token)
      - meter: tokens
        dimension_match: { model: gpt-5.1, token_type: input }
        mode: per_unit
        unit_amount_cents: '0.000125'
      - meter: tokens
        dimension_match: { model: gpt-5.1, token_type: cache_read }
        mode: per_unit
        unit_amount_cents: '0.0000125'
      - meter: tokens
        dimension_match: { model: gpt-5.1, token_type: output }
        mode: per_unit
        unit_amount_cents: '0.001'

      # gpt-5 — input $1.25 / output $10 per million; cache read $0.125 (per-token)
      - meter: tokens
        dimension_match: { model: gpt-5, token_type: input }
        mode: per_unit
        unit_amount_cents: '0.000125'
      - meter: tokens
        dimension_match: { model: gpt-5, token_type: cache_read }
        mode: per_unit
        unit_amount_cents: '0.0000125'
      - meter: tokens
        dimension_match: { model: gpt-5, token_type: output }
        mode: per_unit
        unit_amount_cents: '0.001'

      # gpt-5-mini — input $0.25 / output $2 per million; cache read $0.025 (per-token)
      - meter: tokens
        dimension_match: { model: gpt-5-mini, token_type: input }
        mode: per_unit
        unit_amount_cents: '0.000025'
      - meter: tokens
        dimension_match: { model: gpt-5-mini, token_type: cache_read }
        mode: per_unit
        unit_amount_cents: '0.0000025'
      - meter: tokens
        dimension_match: { model: gpt-5-mini, token_type: output }
        mode: per_unit
        unit_amount_cents: '0.0002'

      # gpt-5-nano — input $0.05 / output $0.40 per million; cache read $0.005 (per-token)
      - meter: tokens
        dimension_match: { model: gpt-5-nano, token_type: input }
        mode: per_unit
        unit_amount_cents: '0.000005'
      - meter: tokens
        dimension_match: { model: gpt-5-nano, token_type: cache_read }
        mode: per_unit
        unit_amount_cents: '0.0000005'
      - meter: tokens
        dimension_match: { model: gpt-5-nano, token_type: output }
        mode: per_unit
        unit_amount_cents: '0.00004'

      # gpt-4.1 — input $2 / output $8 per million; cache read $0.50 (per-token)
      - meter: tokens
        dimension_match: { model: gpt-4.1, token_type: input }
        mode: per_unit
        unit_amount_cents: '0.0002'
      - meter: tokens
        dimension_match: { model: gpt-4.1, token_type: cache_read }
        mode: per_unit
        unit_amount_cents: '0.00005'
      - meter: tokens
        dimension_match: { model: gpt-4.1, token_type: output }
        mode: per_unit
        unit_amount_cents: '0.0008'

      # gpt-4.1-mini — input $0.40 / output $1.60 per million; cache read $0.10 (per-token)
      - meter: tokens
        dimension_match: { model: gpt-4.1-mini, token_type: input }
        mode: per_unit
        unit_amount_cents: '0.00004'
      - meter: tokens
        dimension_match: { model: gpt-4.1-mini, token_type: cache_read }
        mode: per_unit
        unit_amount_cents: '0.00001'
      - meter: tokens
        dimension_match: { model: gpt-4.1-mini, token_type: output }
        mode: per_unit
        unit_amount_cents: '0.00016'

      # gpt-4.1-nano — input $0.10 / output $0.40 per million; cache read $0.025 (per-token)
      - meter: tokens
        dimension_match: { model: gpt-4.1-nano, token_type: input }
        mode: per_unit
        unit_amount_cents: '0.00001'
      - meter: tokens
        dimension_match: { model: gpt-4.1-nano, token_type: cache_read }
        mode: per_unit
        unit_amount_cents: '0.0000025'
      - meter: tokens
        dimension_match: { model: gpt-4.1-nano, token_type: output }
        mode: per_unit
        unit_amount_cents: '0.00004'

      # ---- Legacy families (kept: proxies mid-migration still route them,
      # and the LiteLLM mapper still families them — dropping the prices
      # would leave that traffic unbilled at cycle close). ----

      # gpt-4-turbo — input $10 / output $30 per million. NO cached-input
      # price: OpenAI's model page publishes none (the model predates prompt
      # caching) — the rate previously here was fictitious (dropped 2026-07-26).
      - meter: tokens
        dimension_match: { model: gpt-4-turbo, token_type: input }
        mode: per_unit
        unit_amount_cents: '0.001'
      - meter: tokens
        dimension_match: { model: gpt-4-turbo, token_type: output }
        mode: per_unit
        unit_amount_cents: '0.003'

      # gpt-4o — input $2.50 / output $10 per million; cache read $1.25 (per-token)
      - meter: tokens
        dimension_match: { model: gpt-4o, token_type: input }
        mode: per_unit
        unit_amount_cents: '0.00025'
      - meter: tokens
        dimension_match: { model: gpt-4o, token_type: cache_read }
        mode: per_unit
        unit_amount_cents: '0.000125'
      - meter: tokens
        dimension_match: { model: gpt-4o, token_type: output }
        mode: per_unit
        unit_amount_cents: '0.001'

      # gpt-4o-mini — input $0.15 / output $0.60 per million; cache read $0.075 (per-token).
      # Decimal carries the exact $0.075/M cache rate (0.0000075), not the old rounded 7c/M.
      - meter: tokens
        dimension_match: { model: gpt-4o-mini, token_type: input }
        mode: per_unit
        unit_amount_cents: '0.000015'
      - meter: tokens
        dimension_match: { model: gpt-4o-mini, token_type: cache_read }
        mode: per_unit
        unit_amount_cents: '0.0000075'
      - meter: tokens
        dimension_match: { model: gpt-4o-mini, token_type: output }
        mode: per_unit
        unit_amount_cents: '0.00006'

      # gpt-3.5-turbo — $0.50 / $1.50 per million (no public cache rate) (per-token)
      - meter: tokens
        dimension_match: { model: gpt-3.5-turbo, token_type: input }
        mode: per_unit
        unit_amount_cents: '0.00005'
      - meter: tokens
        dimension_match: { model: gpt-3.5-turbo, token_type: output }
        mode: per_unit
        unit_amount_cents: '0.00015'

      # Embeddings — per million input tokens, no output rate (per-token).
      - meter: tokens
        dimension_match: { model: text-embedding-3-small }
        mode: per_unit
        unit_amount_cents: '0.000002'
      - meter: tokens
        dimension_match: { model: text-embedding-3-large }
        mode: per_unit
        unit_amount_cents: '0.000013'
      - meter: tokens
        dimension_match: { model: text-embedding-ada-002 }
        mode: per_unit
        unit_amount_cents: '0.00001'

      # Token types do not overlap, so one price per (model, token_type)
      # takes each event.

