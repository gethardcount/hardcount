version: "2"

linters:
  default: standard
  enable:
    - forbidigo
    - nolintlint

  settings:
    # A waiver must name the linter it waives and say why, so a bare
    # //nolint or //nolint:forbidigo cannot silence the rules below.
    nolintlint:
      require-explanation: true
      require-specific: true
    forbidigo:
      # Match on what a call resolves to, not how it is spelled, so an aliased
      # import (stdtime.Now) is caught too.
      analyze-types: true
      forbid:
        # One piece of work reads one time, the instant bound on its ctx, and
        # a test can fix that time. In the billing packages (scoped under
        # exclusions below), read the time through the clock: s.clock.Now(ctx)
        # in a service, clock.Now(ctx) in a store or render code. A genuine
        # wall-clock use says why on the same line:
        #   //nolint:forbidigo // wall-clock: <reason>
        - pattern: ^time\.Now$
          msg: "wall-clock: use s.clock.Now(ctx) or clock.Now(ctx), so one piece of work reads one time and a test can fix it; if wall-clock time is intended, add //nolint:forbidigo // wall-clock: <reason>"
        # Funding-set invariant (ADR-048 amendment): a billing period can be
        # funded by more than one invoice, so a period-wide credit, clawback or
        # void must use FindFundingInvoicesForPeriod. A single-row lookup that
        # is genuinely right (a routing gate, a dedup replay) says why:
        #   //nolint:forbidigo // single-invoice-ok: <reason>
        - pattern: \.(FindBaseInvoiceForPeriod|GetByProrationSource)$
          msg: "single-invoice-ok: a period can be funded by several invoices; use FindFundingInvoicesForPeriod (ADR-048 amendment), or add //nolint:forbidigo // single-invoice-ok: <reason>"
        # A real instant on a context is trusted as one read of the server's
        # clock (clock.EnsureEffectiveNow keeps it), so production makes one
        # only by reading a clock. A place that must name an instant
        # says why: //nolint:forbidigo // real-instant: <reason>
        - pattern: ^clock\.WithEffectiveNow$
          pkg: ^github\.com/gethardcount/hardcount/internal/platform/clock$
          msg: "real-instant: bind a real instant by reading a clock (clock.EnsureEffectiveNow, or clock.AtArrival for a payment's result), or add //nolint:forbidigo // real-instant: <reason>"

  exclusions:
    rules:
      # Each forbidigo rule applies only to the packages that own the invariant.
      # The text match selects the rule by the start of its message.
      - linters: [forbidigo]
        text: "wall-clock:"
        path-except: ^internal/(subscription|invoice|credit|dunning|customer|billing|creditnote|integrations/litellm)/
      - linters: [forbidigo]
        text: "single-invoice-ok:"
        path-except: ^internal/(subscription|billing)/
      # The clock package's own readers (EnsureEffectiveNow, AtArrival) make it.
      - linters: [forbidigo]
        text: "real-instant:"
        path: ^internal/platform/clock/
      # Tests may use wall-clock time and single-row lookups freely.
      - linters: [forbidigo]
        path: _test\.go$
      # stripe-go deprecates Params.Metadata for the Metadata field of each
      # typed params struct. Moving the payment calls changes what they send
      # to Stripe, so it follows the money-path playbook in its own change:
      # remove this rule with issue #834. Every other SA1019 still fails.
      - linters: [staticcheck]
        text: 'SA1019: \(github\.com/stripe/stripe-go/v82\.Params\)\.Metadata is deprecated'

formatters:
  enable:
    - gofmt
