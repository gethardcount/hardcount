<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The website's icon set: a solid ink tile, so the mark shows on a light
         or a dark tab (strokes alone vanished on one or the other). -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hardcount</title>
    <script>
      // Apply the saved theme before first paint, on every route (sign-in and
      // public pages too), so a dark-mode user never sees a light flash and
      // the login page follows the same setting as the dashboard.
      // Customer-facing pages (hosted invoice, payment-method pages, portal)
      // stay light: they are documents a customer opens, not the dashboard.
      try {
        var p = location.pathname;
        var customerFacing = /^\/(invoice\/|update-payment|payment-method-added|portal)/.test(p);
        var t = customerFacing ? 'light' : localStorage.getItem('hardcount-theme');
        if (t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
