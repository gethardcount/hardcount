name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Manual/API escape hatch (2026-07-27): during the GitHub Actions
  # event-delivery degradation, pull_request events were silently
  # dropped for hours and no run was ever created — leaving green,
  # protection-blocked PRs with "no checks" and nothing to retry.
  # workflow_dispatch lets `gh workflow run ci.yml --ref <branch>`
  # mint the run directly through the API (no webhook pipeline);
  # its check runs attach to the head SHA, satisfying the same
  # required checks.
  workflow_dispatch:

# One live run per ref: repeated pushes to a PR cancel the obsolete
# run instead of queueing behind it — less event pressure, faster
# feedback, no duplicate spend. On main a RUNNING build is never
# cancelled, but a build still WAITING is replaced by a newer push, so
# not every main commit gets its own run. Running main one at a time
# keeps the :latest image in commit order.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least-privilege GITHUB_TOKEN (docs: "set the default permission for the
# GITHUB_TOKEN to read access only"). Specifying any scope zeroes the
# rest; the docker job re-widens its own (packages/id-token) per-job.
permissions:
  contents: read

jobs:
  # Everything that needs no database. It used to sit in front of the
  # integration suite in the test job, adding about two and a half minutes
  # to the longest job in the run.
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Unit Tests (with race detector)
        run: go test ./... -race -short -count=1 -coverprofile=coverage.out

      - name: Upload Coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
        continue-on-error: true

  test:
    # Pinned, not ubuntu-latest: the jobs rely on tools preinstalled on the
    # image (psql, jq, docker). Move every job to the next image in its own PR.
    runs-on: ubuntu-24.04
    # 35, not 20: measured 2026-08-31 across 12 runs, this job takes 7-10
    # minutes normally — but a slow runner stretches everything uniformly
    # (~3.35x observed across unrelated packages, 323s -> 1060s of package
    # time for identical code), which pushes 9 minutes past a 20-minute cap.
    # Both jobs were cancelled that way on the same day, each costing a
    # diagnosis and a re-run of green code. The cap is here to bound a HANG —
    # which would sit forever regardless — not to police runner variance, so
    # it buys headroom above the observed variance instead of tracking the
    # median. If a job ever legitimately approaches 35 minutes, split the
    # suite rather than raising this again.
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hardcount
          POSTGRES_USER: hardcount
          POSTGRES_PASSWORD: hardcount
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U hardcount -d hardcount"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify modules
        run: go mod verify

      - name: Create test database and app user
        run: |
          # docker/init.sql is the one definition of the roles, the test
          # database and its grants; local dev mounts the same file.
          PGPASSWORD=hardcount psql -v ON_ERROR_STOP=1 -h localhost -U hardcount -d hardcount -f docker/init.sql
          # This database is thrown away with the job, so it does not need to
          # survive a crash. Skipping the disk flushes removes the runs where a
          # slow runner disk made the suite two to four times slower.
          PGPASSWORD=hardcount psql -v ON_ERROR_STOP=1 -h localhost -U hardcount -d hardcount \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"

      - name: Integration Tests
        run: go test -p 1 ./... -count=1 -short=false
        env:
          TEST_ADMIN_DATABASE_URL: postgres://hardcount:hardcount@localhost:5432/hardcount_test?sslmode=disable
          TEST_DATABASE_URL: postgres://hardcount_test_app:hardcount_test_app@localhost:5432/hardcount_test?sslmode=disable

  # The pricing-shapes suite (ADR-130): each common way to price with
  # Hardcount, billed end to end and checked to the cent, plus the goldens of
  # each price shape on every rating path. The test job runs these too;
  # this job gives them a check of their own, so a branch rule can require
  # it.
  pricing-shapes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hardcount
          POSTGRES_USER: hardcount
          POSTGRES_PASSWORD: hardcount
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U hardcount -d hardcount"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Create test database and app user
        run: |
          PGPASSWORD=hardcount psql -v ON_ERROR_STOP=1 -h localhost -U hardcount -d hardcount -f docker/init.sql
          PGPASSWORD=hardcount psql -v ON_ERROR_STOP=1 -h localhost -U hardcount -d hardcount \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"

      - name: Pricing shapes, through the API
        run: >-
          go test -p 1 -count=1 -short=false -v ./internal/api
          -run '^(TestPricingShapes_|TestE2E_PlanPrices_TwoPlansPriceOneMeterDifferently$|TestE2E_PlanPrices_SwapPricesEachWindowByItsPlan$)'
        env:
          TEST_ADMIN_DATABASE_URL: postgres://hardcount:hardcount@localhost:5432/hardcount_test?sslmode=disable
          TEST_DATABASE_URL: postgres://hardcount_test_app:hardcount_test_app@localhost:5432/hardcount_test?sslmode=disable

      - name: Price shape goldens, on every rating path
        run: >-
          go test -p 1 -count=1 -short=false -v ./internal/billing
          -run '^(TestPriceShapes_|TestRateShapes_)'
        env:
          TEST_ADMIN_DATABASE_URL: postgres://hardcount:hardcount@localhost:5432/hardcount_test?sslmode=disable
          TEST_DATABASE_URL: postgres://hardcount_test_app:hardcount_test_app@localhost:5432/hardcount_test?sslmode=disable

  # The same integration suite with the APP pool behind PgBouncer in
  # TRANSACTION mode (ADR-114 PR-E). Since the leader-lease cutover every
  # statement Hardcount issues is meant to be self-contained; this job is what
  # makes that a checked property instead of a claim. Anything that assumes
  # a session — SET without LOCAL, a session advisory lock, a prepared
  # statement reused across transactions — passes on the direct-connection
  # job above and can misbehave here. The pooler does not reject such a
  # statement; what this job proves is that the whole suite still passes
  # through it. Admin/migration traffic stays direct, as
  # production migrations do (docs/ops/postgres-requirements.md).
  test-pgbouncer:
    runs-on: ubuntu-24.04
    # 35, not 20: measured 2026-08-31 across 12 runs, this job takes 7-10
    # minutes normally — but a slow runner stretches everything uniformly
    # (~3.35x observed across unrelated packages, 323s -> 1060s of package
    # time for identical code), which pushes 9 minutes past a 20-minute cap.
    # Both jobs were cancelled that way on the same day, each costing a
    # diagnosis and a re-run of green code. The cap is here to bound a HANG —
    # which would sit forever regardless — not to police runner variance, so
    # it buys headroom above the observed variance instead of tracking the
    # median. If a job ever legitimately approaches 35 minutes, split the
    # suite rather than raising this again.
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hardcount
          POSTGRES_USER: hardcount
          POSTGRES_PASSWORD: hardcount
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U hardcount -d hardcount"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Create test database and app user
        run: |
          # Same setup as the test job above.
          PGPASSWORD=hardcount psql -v ON_ERROR_STOP=1 -h localhost -U hardcount -d hardcount -f docker/init.sql
          PGPASSWORD=hardcount psql -v ON_ERROR_STOP=1 -h localhost -U hardcount -d hardcount \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"

      - name: Integration Tests through PgBouncer (transaction mode)
        run: PGB_MODE=ci scripts/pgbouncer-test.sh

  # A fresh install of HEAD under three role setups (Compose, managed
  # Postgres, the CI test database): every migration applies to an empty
  # database, a second run has nothing to do, and the limited user has the
  # idle-transaction timeout. Also a restore drill (a HEAD backup restored
  # into an empty database with scripts/restore.sh) and an apply on
  # Postgres 15 and on 18. Each Postgres runs in its own container, so the
  # job has no service.
  migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build HEAD
        run: go build -o "${{ runner.temp }}/hardcount" ./cmd/hardcount

      - name: Fresh install under each role setup
        run: scripts/ci/migrations-fresh-install.sh
        env:
          HARDCOUNT_BIN: ${{ runner.temp }}/hardcount
          KEEP_OUT: ${{ runner.temp }}/migrations-out

      - name: Upload outputs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: migrations-out
          path: ${{ runner.temp }}/migrations-out
          retention-days: 7

  # An upgrade from the previous release (ADR-125, amendment 2026-10-30).
  # The newest v* tag, built from its own source, installs on an empty
  # database and bills a month with its demo. Then HEAD starts on that
  # database and runs its migrations. Every invoice from before must read the
  # same through the API, HEAD must bill a new month there, and
  # hardcount-doctor must find nothing. The script starts its own Postgres,
  # so the job has no service. Not a required check yet.
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # The tags and their history: the script picks the previous
          # release from them and checks it out in a git worktree.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Upgrade from the previous release
        run: scripts/ci/upgrade-from-previous-tag.sh
        env:
          KEEP_OUT: ${{ runner.temp }}/upgrade-out

      - name: Upload outputs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: upgrade-out
          path: ${{ runner.temp }}/upgrade-out
          retention-days: 7

  # Golden path: the first-invoice tutorial's own commands, then the README
  # quickstart + scripts/demo.sh, executed for real.
  # This is the whole wedge chain in one run — recipe → test-clock customer →
  # LiteLLM-shaped token ingest → provider cost rates → simulated month →
  # finalized invoice with per-(model, token_type) lines + PDF → margin
  # report. demo.sh fails loudly at the first API mismatch, so this job is
  # what keeps the front door structurally unable to lie again (it rotted
  # silently for months once — front-door audit 2026-07-05, PR #374).
  golden-path:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hardcount
          POSTGRES_USER: hardcount
          POSTGRES_PASSWORD: hardcount
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U hardcount -d hardcount"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://hardcount:hardcount@localhost:5432/hardcount?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Create app role (mirrors deploy/compose/postgres-init.sh)
        run: |
          # Same grants production init gives the runtime role — without the
          # DEFAULT PRIVILEGES line, tables created by migrations are
          # invisible to hardcount_app and the API 500s (caught by this job's
          # first run: permission denied for provider_cost_rates).
          PGPASSWORD=hardcount psql -v ON_ERROR_STOP=1 -h localhost -U hardcount -d hardcount <<'EOSQL'
          CREATE ROLE hardcount_app WITH LOGIN PASSWORD 'hardcount_app';
          GRANT ALL PRIVILEGES ON DATABASE hardcount TO hardcount_app;
          GRANT ALL ON SCHEMA public TO hardcount_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO hardcount_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO hardcount_app;
          ALTER ROLE hardcount_app SET idle_in_transaction_session_timeout = '30s';
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          EOSQL

      - name: Bootstrap (migrations + demo tenant + keys)
        run: |
          go run ./cmd/hardcount-bootstrap | tee bootstrap.out
          grep -oE 'hc_secret_test_[a-f0-9]+' bootstrap.out | head -1 > secret.key
          test -s secret.key

      - name: Start API
        run: |
          nohup go run ./cmd/hardcount > server.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:8080/health >/dev/null || { echo "server never became healthy"; tail -50 server.log; exit 1; }
          # Without this line the server has fallen back to the owner
          # connection, where row-level security does not apply, and the
          # demo would pass without tenant isolation being on.
          grep -q 'using app database connection (RLS enforced)' server.log \
            || { echo "server is not on the app connection: row-level security is off"; tail -50 server.log; exit 1; }

      # docs/first-invoice.md, run from its own code blocks by
      # cmd/hardcount-docs-run, before the demo, as on a fresh install. The page
      # reads the test key from the file the quick start writes, so this
      # writes that file. The first pass sends the usage both ways (5a, then
      # 5b, which deduplicates). The second takes only 5b, for a new
      # customer, as the page's "already exists" row says to. Step 1 says
      # applying the recipe again returns the same setup, so the plans and
      # meters must be the same after the second pass as after the first.
      - name: Run the first-invoice tutorial (docs/first-invoice.md)
        run: |
          set -o pipefail
          shopt -s inherit_errexit
          jq -n --arg k "$(cat secret.key)" '{secret_key_test: $k}' > deploy/compose/quickstart-credentials.json
          go build -o "$RUNNER_TEMP/hardcount-docs-run" ./cmd/hardcount-docs-run
          setup() {
            for kind in plans meters; do
              curl -sf "http://localhost:8080/v1/$kind" -H "Authorization: Bearer $(cat secret.key)" \
                | jq -ec --arg kind "$kind" '{($kind): [.data[].id] | sort}'
            done
          }
          "$RUNNER_TEMP/hardcount-docs-run" docs/first-invoice.md
          after_first=$(setup)
          "$RUNNER_TEMP/hardcount-docs-run" -skip 5a -replace acme-1=acme-2 docs/first-invoice.md
          after_second=$(setup)
          echo "$after_first"
          [ "$after_first" = "$after_second" ] || { echo "Applying the recipe again changed the plans or meters:"; echo "$after_second"; exit 1; }

      - name: Run the golden path (scripts/demo.sh)
        run: ./scripts/demo.sh "$(cat secret.key)"

      # Money-invariant sweep over rows written by the real server through its
      # API: an invoice, usage, a subscription.
      - name: Money-invariant sweep over the demo data (hardcount-doctor)
        run: go run ./cmd/hardcount-doctor

      - name: Server log on failure
        if: failure()
        run: tail -100 server.log || true

  # The dashboard in a real browser (Playwright, Chromium) against a real API
  # and seeded data: every page at desktop and phone width, plus a few key
  # journeys, plus screenshots of the activity cards. The server setup is a
  # copy of golden-path's. A required check. How to run it locally:
  # web-v2/e2e/README.md.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hardcount
          POSTGRES_USER: hardcount
          POSTGRES_PASSWORD: hardcount
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U hardcount -d hardcount"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      # Takes the emails the API sends, so an email reads as sent instead of
      # failing for want of a mail server. Nothing leaves the runner.
      mailpit:
        image: axllent/mailpit:v1.31.3
        ports:
          - 1025:1025
    env:
      DATABASE_URL: postgres://hardcount:hardcount@localhost:5432/hardcount?sslmode=disable
      HARDCOUNT_BOOTSTRAP_EMAIL: e2e@example.com
      HARDCOUNT_BOOTSTRAP_PASSWORD: e2e-password-not-secret
      E2E_EMAIL: e2e@example.com
      E2E_PASSWORD: e2e-password-not-secret
      E2E_BASE_URL: http://127.0.0.1:4173
      E2E_API_URL: http://127.0.0.1:8080
      # Mailpit has no TLS. SMTP_TLS=none is refused only in production.
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      SMTP_TLS: none
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-v2/package-lock.json

      - name: Create app role (mirrors deploy/compose/postgres-init.sh)
        run: |
          PGPASSWORD=hardcount psql -v ON_ERROR_STOP=1 -h localhost -U hardcount -d hardcount <<'EOSQL'
          CREATE ROLE hardcount_app WITH LOGIN PASSWORD 'hardcount_app';
          GRANT ALL PRIVILEGES ON DATABASE hardcount TO hardcount_app;
          GRANT ALL ON SCHEMA public TO hardcount_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO hardcount_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO hardcount_app;
          ALTER ROLE hardcount_app SET idle_in_transaction_session_timeout = '30s';
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          EOSQL

      - name: Bootstrap (migrations + demo tenant + keys)
        run: |
          go run ./cmd/hardcount-bootstrap | tee bootstrap.out
          key=$(grep -oE 'hc_secret_test_[a-f0-9]+' bootstrap.out | head -1)
          test -n "$key"
          echo "E2E_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Start API
        run: |
          nohup go run ./cmd/hardcount > server.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:8080/health >/dev/null || { echo "server never became healthy"; tail -50 server.log; exit 1; }
          grep -q 'using app database connection (RLS enforced)' server.log \
            || { echo "server is not on the app connection: row-level security is off"; tail -50 server.log; exit 1; }

      - name: Install frontend dependencies
        run: cd web-v2 && npm ci

      # The browser build depends only on the Playwright version, so key on
      # that: unrelated lockfile changes keep the cache.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./web-v2/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: cd web-v2 && npx playwright install --with-deps chromium

      - name: Build and serve the dashboard (vite preview, /v1 proxied to the API)
        run: |
          cd web-v2
          npm run build
          HARDCOUNT_API_TARGET=http://127.0.0.1:8080 nohup npx vite preview --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4173/ >/dev/null || { echo "vite preview never came up"; cat preview.log; exit 1; }

      - name: Run Playwright
        run: cd web-v2 && npx playwright test

      # The activity cards on both clocks (activity.spec.ts), on every run,
      # so a PR's shots can be compared with main's.
      - name: Upload activity screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: activity-shots
          path: web-v2/activity-shots/
          retention-days: 14

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web-v2/playwright-report/
            web-v2/test-results/
          retention-days: 14

      - name: Server log on failure
        if: failure()
        run: tail -100 server.log || true

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Pinned, so a golangci-lint release cannot change CI results without a
      # change in this repo: a newer release flags code this one passes (see
      # #834). Bump it deliberately, with the fix for whatever the new version
      # flags. The SHA-256 is the linux-amd64 archive's, from
      # golangci-lint-<version>-checksums.txt in the same release.
      GOLANGCI_LINT_VERSION: 2.12.2
      GOLANGCI_LINT_SHA256: 8df580d2670fed8fa984aac0507099af8df275e665215f5c7a2ae3943893a553
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # golangci-lint comes from the Actions cache, so a run with a cache hit
      # downloads nothing from GitHub releases. The action's own cache holds
      # lint results, not the binary, and its own install downloads every run.
      - name: Restore golangci-lint from the cache
        id: golangci-lint-bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/golangci-lint/${{ env.GOLANGCI_LINT_VERSION }}
          key: golangci-lint-binary-${{ env.GOLANGCI_LINT_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Download golangci-lint
        if: steps.golangci-lint-bin.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          name="golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/$name.tar.gz"
          echo "$GOLANGCI_LINT_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          dir="$RUNNER_TOOL_CACHE/golangci-lint/$GOLANGCI_LINT_VERSION"
          mkdir -p "$dir"
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$dir" --strip-components=1 "$name/golangci-lint"

      - name: Put golangci-lint on PATH
        run: echo "$RUNNER_TOOL_CACHE/golangci-lint/$GOLANGCI_LINT_VERSION" >> "$GITHUB_PATH"

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Run the golangci-lint on PATH, the one restored or downloaded above.
          install-mode: none

      # The Dockerfile's builder image must be at least go.mod's `go` directive.
      # It runs GOTOOLCHAIN=local, so an older builder does not quietly fetch a
      # newer toolchain — `go mod download` just fails.
      #
      # This is checked HERE, in a job that runs on pull requests, because the
      # docker job only runs on main. Bumping go.mod's directive in a PR left
      # every subsequent main build broken with nothing failing on the PR itself;
      # main sat red for days behind a job nobody was watching.
      - name: Go version consistency (go.mod vs Dockerfile builder)
        run: |
          set -euo pipefail
          MOD=$(awk '/^go [0-9]/ {print $2; exit}' go.mod)
          IMG=$(sed -n 's/^FROM \(--platform=[^ ]* \)\{0,1\}golang:\([0-9.]*\)-alpine AS builder$/\2/p' Dockerfile)
          if [ -z "$MOD" ] || [ -z "$IMG" ]; then
            echo "could not parse versions (go.mod='$MOD' Dockerfile='$IMG')" >&2
            exit 1
          fi
          echo "go.mod requires go $MOD; Dockerfile builds on golang:$IMG-alpine"
          # Lowest of the two must be the go.mod one, i.e. IMG >= MOD.
          if [ "$(printf '%s\n%s\n' "$MOD" "$IMG" | sort -V | head -1)" != "$MOD" ]; then
            echo "::error::Dockerfile builder golang:$IMG is OLDER than go.mod's 'go $MOD'. The image build runs GOTOOLCHAIN=local and will fail with 'go.mod requires go >= $MOD'. Bump the FROM line in Dockerfile." >&2
            exit 1
          fi

      # The quickstart pulls a pinned release. It must name the same release
      # as the Compose template, so a release bump cannot update one and
      # leave the other pointing at an older version.
      - name: Quickstart release matches the Compose template
        run: |
          set -euo pipefail
          QS=$(sed -n 's/^HARDCOUNT_VERSION="\(.*\)"$/\1/p' deploy/compose/quickstart.sh)
          ENV=$(sed -n 's|^# HARDCOUNT_IMAGE=ghcr.io/gethardcount/hardcount:\(v[0-9.]*\)$|\1|p' deploy/compose/.env.example)
          echo "quickstart.sh: $QS   .env.example: $ENV"
          if [ -z "$QS" ] || [ "$QS" != "$ENV" ]; then
            echo "::error::deploy/compose/quickstart.sh HARDCOUNT_VERSION ($QS) must equal the image tag in deploy/compose/.env.example ($ENV)"
            exit 1
          fi

      # quickstart.sh shares its folder with installs made by hand, and its
      # destroy deletes data. It must refuse an .env it did not write (a copy
      # of .env.example), touch nothing without an .env, and name its own
      # Compose project on every call. A fake docker records the calls.
      - name: quickstart.sh acts only on its own install
        run: scripts/ci/quickstart-own-install.sh

      # Last, so a newly published advisory (the usual reason this fails, with
      # no change in this repo) does not hide the results of the steps above.
      # The matcher is removed so govulncheck's call traces stay plain text
      # instead of becoming annotations.
      - name: Vulnerability check
        run: |
          echo "::remove-matcher owner=go::"
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4 && govulncheck ./...

  # codegen-drift fails the build when api/openapi.yaml has been edited
  # without regenerating the TS artifacts that derive from it
  # (or vice versa — when a generated file was hand-edited). The check
  # is `make gen && git diff --exit-code`: regenerate everything from
  # the canonical spec, then assert nothing in the working tree
  # changed. Same pattern Stripe uses internally to keep its SDK
  # repos in sync with the openapi repo.
  # Internal Markdown links only — a moved or renamed doc breaks a link
  # silently, and this repo's docs cross-reference heavily (ADRs, benchmark
  # docs, the failure-mode catalog). External URLs are deliberately NOT
  # checked here: a third-party site being down or rate-limiting would fail
  # unrelated PRs. Run `lychee --offline '**/*.md'` locally for the same check.
  doc-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The SHA-256 is the x86_64-unknown-linux-gnu archive's, from the
      # .sha256 file published next to it in the same release.
      LYCHEE_VERSION: 0.24.2
      LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
    steps:
      - uses: actions/checkout@v7

      # lychee comes from the Actions cache, so a run with a cache hit
      # downloads nothing from GitHub releases. lychee-action downloads lychee
      # on every run, so this job runs lychee itself.
      - name: Restore lychee from the cache
        id: lychee-bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/lychee/${{ env.LYCHEE_VERSION }}
          key: lychee-binary-${{ env.LYCHEE_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Download lychee
        if: steps.lychee-bin.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          name=lychee-x86_64-unknown-linux-gnu
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/$name.tar.gz"
          echo "$LYCHEE_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          dir="$RUNNER_TOOL_CACHE/lychee/$LYCHEE_VERSION"
          mkdir -p "$dir"
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$dir" --strip-components=1 "$name/lychee"

      # --offline: resolve local file paths and anchors, skip the network.
      # lychee exits non-zero on a broken link, which fails the job.
      - name: Check internal Markdown links
        run: >-
          "$RUNNER_TOOL_CACHE/lychee/$LYCHEE_VERSION/lychee"
          --offline --no-progress --include-fragments '**/*.md'

  # Prose lint against docs/dev/writing-style.md (rules in .vale/styles/Hardcount).
  # Advisory: it annotates only lines the PR adds and never fails the run, so
  # older docs are not flagged until someone edits them. Run `vale <file>`
  # locally for the same check.
  doc-style:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      VALE_VERSION: 3.24.0
      REVIEWDOG_VERSION: 0.21.0
    steps:
      - uses: actions/checkout@v7

      # vale-action looks for Vale and reviewdog in the runner's tool cache
      # before it downloads them, so a cache hit skips both downloads. On a
      # miss the action downloads each one and checks it against its release's
      # checksums. This job runs only on pull requests, and a pull request
      # cannot read another one's cache, so each pull request's first run
      # still downloads them.
      - name: Restore Vale from the cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/vale/${{ env.VALE_VERSION }}
          key: vale-binary-${{ env.VALE_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Restore reviewdog from the cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/reviewdog/${{ env.REVIEWDOG_VERSION }}
          key: reviewdog-binary-${{ env.REVIEWDOG_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Lint added prose with Vale
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          version: ${{ env.VALE_VERSION }}
          reviewdog_version: ${{ env.REVIEWDOG_VERSION }}
          filter_mode: added

  codegen-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-v2/package-lock.json

      - name: Install web-v2 deps
        run: cd web-v2 && npm ci

      - name: Regenerate from api/openapi.yaml
        run: make gen

      - name: Fail on uncommitted regenerated files
        run: |
          if ! git diff --exit-code; then
            echo "::error::api/openapi.yaml drift: regenerated files differ from committed copies. Run 'make gen' locally and commit the result."
            exit 1
          fi

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-v2/package-lock.json

      - name: Install and build frontend
        # `npm run build` = `tsc -b && vite build` — the strict project-
        # references build (tsconfig.app.json: noUnusedLocals etc.). The old
        # `npx tsc --noEmit` used the looser root config and `vite build`
        # strips types without checking, so production type errors (incl.
        # genuine bugs) accumulated invisibly. The production build is the gate.
        run: cd web-v2 && npm ci && npm run build

      # The web-v2 unit suite (effectiveNow drift-guard, csv, vocabulary) ran
      # NOWHERE in CI until 2026-07-19 — a green pipeline said nothing about
      # it.
      # `npm test` = `vitest run` over web-v2/tests; the build step above
      # already type-checked those tests (tsconfig.test.json under `tsc -b`).
      - name: Frontend unit tests
        run: cd web-v2 && npm test

      # Lint gates the ERROR-level rules: the ADR-086 relative-time ban
      # (raw Date.now()) and the react-hooks error rules (refs,
      # set-state-in-effect, static-components). Warn-level rules —
      # exhaustive-deps among them — do NOT fail the run (plain eslint,
      # no --max-warnings): they surface in the log only. First wired
      # 2026-07-19 after the 10 react-hooks errors blocking a green run
      # were fixed — before that, eslint.config.js claimed to be a CI
      # gate while lint ran nowhere. After eslint, knip fails on unused
      # files, exports and dependencies (web-v2/knip.jsonc).
      - name: Frontend lint
        run: cd web-v2 && npm run lint

  docker:
    timeout-minutes: 30
    # Every check an image must pass before it is published. Each one is
    # also a required check on main (with e2e), so keep this list and the
    # branch protection's required checks the same. The upgrade job is
    # neither yet: it joins both lists when it becomes a required check.
    needs: [test, unit, test-pgbouncer, pricing-shapes, migrations, golden-path, codegen-drift, frontend, lint]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      # contents: write — anchore/sbom-action attaches the SBOM to the
      # GitHub release on tag runs (REST call; read-only token fails with
      # "Resource not accessible by integration", which skipped Grype+Cosign
      # on v0.3.0/v0.3.1 — those two image sets shipped unsigned).
      contents: write
      packages: write
      id-token: write
    # The tools the scan and sign steps run. Each is pinned to a version and
    # to the SHA-256 of its linux-amd64 file in that release, from the
    # release's checksums file. Dependabot updates the actions, not these:
    # bump a version and its hash together, by hand.
    env:
      SYFT_VERSION: 1.54.0
      SYFT_SHA256: 54a87372498168b2d033e876fd41fa4e8035b872699e525a57046e1f2f09c860
      GRYPE_VERSION: 0.118.0
      GRYPE_SHA256: 1d444c5e7360471815f7158f71935fcecc68a3c417d85c7344f770854300bba2
      COSIGN_VERSION: 3.0.6
      COSIGN_SHA256: c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74
    steps:
      - uses: actions/checkout@v7

      # Syft, Grype and Cosign are downloaded on every run, never restored
      # from the Actions cache. Every job that runs on main can write that
      # cache, and a restore can write files anywhere on the runner. This job
      # signs and publishes the images, so it must not run what a job without
      # those rights left there. (The Trivy steps below still restore Trivy
      # and its database from the cache: that is trivy-action's default.)
      #
      # A wrong hash fails the job. The step runs before any image is pushed,
      # so a failed download publishes nothing, and curl retries a 5xx answer
      # from GitHub. sbom-action and scan-action look for Syft and Grype in
      # the runner's tool cache, where this step puts them, so they download
      # nothing themselves.
      - name: Download Syft, Grype and Cosign
        run: |
          set -euo pipefail
          dl="$RUNNER_TEMP/release-tools"
          mkdir -p "$dl"
          syft="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          grype="grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          cosign=cosign-linux-amd64
          get() { curl -fsSL --retry 5 --retry-delay 10 -o "$dl/$2" "$1/$2"; }
          get "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}" "$syft"
          get "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}" "$grype"
          get "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}" "$cosign"
          {
            echo "$SYFT_SHA256  $dl/$syft"
            echo "$GRYPE_SHA256  $dl/$grype"
            echo "$COSIGN_SHA256  $dl/$cosign"
          } | sha256sum -c -
          # The layout @actions/tool-cache's find() expects:
          # <tool>/<version>/x64/<binary>, and an x64.complete file beside x64.
          install_tool() {
            dir="$RUNNER_TOOL_CACHE/$1/$2/x64"
            mkdir -p "$dir"
            tar -xzf "$dl/$3" -C "$dir" "$1"
            touch "$dir.complete"
          }
          install_tool syft "$SYFT_VERSION" "$syft"
          install_tool grype "$GRYPE_VERSION" "$grype"
          mkdir -p "$RUNNER_TEMP/cosign"
          install -m 0755 "$dl/$cosign" "$RUNNER_TEMP/cosign/cosign"
          echo "$RUNNER_TEMP/cosign" >> "$GITHUB_PATH"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag pushes (vX.Y.Z) publish a pinnable versioned image + stamp the
      # binary (hardcount version / Hardcount-Version header). Main pushes keep the
      # :sha and :latest moving tags with a dev-<sha> stamp — operators are
      # told to pin version tags (deploy/compose/README.md).
      - name: Compute image tags + version stamp
        id: meta
        run: |
          REPO="ghcr.io/${{ github.repository }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            REF_TAG="${VERSION}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
            REF_TAG="${GITHUB_SHA}"
          fi
          {
            echo "version=${VERSION}"
            echo "ref_tag=${REF_TAG}"
            echo "tags<<TAGS"
            echo "${REPO}:${REF_TAG}"
            echo "${REPO}:latest"
            echo "TAGS"
            echo "dashtags<<DTAGS"
            echo "${REPO}-dashboard:${REF_TAG}"
            echo "${REPO}-dashboard:latest"
            echo "DTAGS"
          } >> "$GITHUB_OUTPUT"


      # No layer cache: main never hit it (every source change invalidates the
      # compile layer) and writing it cost about 80 seconds per run.
      - name: Build and push API image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          # Both platforms, so the image also runs on Apple Silicon and ARM
          # servers. No emulation: each Dockerfile builds on the runner and
          # its final stage only copies files.
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}

      # The operator dashboard image (compose's hardcount-dashboard service) —
      # published alongside the API so a VPC install never builds from
      # source unless it wants to.
      - name: Build and push dashboard image
        id: dashbuild
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/compose/Dockerfile.dashboard
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.dashtags }}

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          # The tag THIS run pushed (version tag on releases, sha on main).
          # github.sha here scanned a tag release runs never push — the
          # published versioned image sailed through unscanned/unsigned.
          image-ref: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.ref_tag }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Scan dashboard image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}-dashboard:${{ steps.meta.outputs.ref_tag }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # Syft and Grype run from the tool cache, where the download step put
      # them (the version inputs tell each action which one to look for).
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v${{ env.SYFT_VERSION }}
          image: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.ref_tag }}
          artifact-name: hardcount-sbom.spdx.json
          format: spdx-json
          output-file: hardcount-sbom.spdx.json

      - name: Scan SBOM (Grype)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          grype-version: v${{ env.GRYPE_VERSION }}
          sbom: hardcount-sbom.spdx.json
          fail-build: true
          severity-cutoff: critical
          # Print the matches in the log. The default wrote them to a file
          # nothing read.
          output-format: table

      # Signed by digest, the exact image this run built, not by a tag that
      # a later push could move.
      - name: Sign both images (Cosign)
        run: |
          cosign sign --yes "${REPO}@${API_DIGEST}"
          cosign sign --yes "${REPO}-dashboard@${DASH_DIGEST}"
        env:
          REPO: ghcr.io/${{ github.repository }}
          API_DIGEST: ${{ steps.build.outputs.digest }}
          DASH_DIGEST: ${{ steps.dashbuild.outputs.digest }}
