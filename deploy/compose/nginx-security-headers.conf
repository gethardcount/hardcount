# Security headers for the dashboard's pages, the hosted invoice (pay) page
# among them. dashboard-nginx.conf includes this file in each location: nginx
# drops a server-level add_header in a location that has its own, and each
# location adds its own Cache-Control. "always" adds them to error responses
# too.

# No other site may show these pages inside a frame, where a hidden page can
# trick a click on Pay or on a dashboard button (clickjacking).
# X-Frame-Options is for older browsers; frame-ancestors for current ones.
# The policy covers framing only. A script-src policy would also have to
# allow the theme script written inline in index.html.
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
# The browser uses the type the server sends, and never runs a file it
# guessed is a script.
add_header X-Content-Type-Options "nosniff" always;
# Another site sees only this site's origin as the Referer, never the path,
# where a link's token can be. The API sends the same policy.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
