# An access-log format that keeps link tokens out of the log. Both nginx
# configs include this file at the http level (where map and log_format
# belong) and log with it: nginx.conf, the front proxy, and
# dashboard-nginx.conf, the dashboard's own nginx.
#
# Some links carry a token that works like a password: whoever holds the link
# can pay the invoice, change the card, read the usage, reset the password or
# join the team. nginx's default format writes the whole URL, and the page's
# address again as the Referer of every request the page makes. This format
# writes [redacted] in place of the token, in both:
#   - the path segment after /invoice/ (the hosted invoice page),
#     /v1/public/invoices/, /v1/public/payment-updates/,
#     /v1/public/cost-dashboard/ and /v1/auth/invite/;
#   - a token= query value, and the rest of the query after it.
# A new link with a token in its path adds its prefix to both path maps
# below, and to loggablePath in internal/api/router.go, which keeps it out of
# the API's own log.
#
# nginx's error log has a fixed format. When nginx fails a request itself,
# for example while the API is down, its error line still holds the URL.

# The request URI: first the path token, then the query token.
map $request_uri $hc_log_uri_path {
    default $request_uri;
    "~^(?<hc_up>/(?:invoice|v1/public/(?:invoices|payment-updates|cost-dashboard)|v1/auth/invite)/)[^/?]+(?<hc_ur>.*)$" "${hc_up}[redacted]${hc_ur}";
}
map $hc_log_uri_path $hc_log_uri {
    default $hc_log_uri_path;
    "~^(?<hc_uq>[^?]*\?(?:[^&]*&)*?token=)" "${hc_uq}[redacted]";
}

# The Referer, a full URL: the same two steps after its scheme and host. No
# Referer is logged as "-", as the default format does.
map $http_referer $hc_log_referer_path {
    default $http_referer;
    "" "-";
    "~^(?<hc_rp>(?:https?://[^/]*)?/(?:invoice|v1/public/(?:invoices|payment-updates|cost-dashboard)|v1/auth/invite)/)[^/?]+(?<hc_rr>.*)$" "${hc_rp}[redacted]${hc_rr}";
}
map $hc_log_referer_path $hc_log_referer {
    default $hc_log_referer_path;
    "~^(?<hc_rq>[^?]*\?(?:[^&]*&)*?token=)" "${hc_rq}[redacted]";
}

# The image's default "main" format, with the two values above in place of
# the request line's URI and the Referer. The user field is always "-": the
# Basic-auth user name of the Postmark webhook is half its credential.
log_format hardcount_redacted
    '$remote_addr - - [$time_local] "$request_method $hc_log_uri $server_protocol" '
    '$status $body_bytes_sent "$hc_log_referer" "$http_user_agent" "$http_x_forwarded_for"';
