# Dashboard container's INTERNAL nginx — serves the built SPA only. The
# compose front proxy (nginx.conf) routes / here and /v1 + friends to the
# API, so the browser sees one origin.

# The access-log format that keeps link tokens out of the log.
include /etc/nginx/hardcount/nginx-log-redact.conf;

server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/access.log hardcount_redacted;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets are immutable; index.html must revalidate so a
    # redeploy is picked up on refresh.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/hardcount/nginx-security-headers.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/hardcount/nginx-security-headers.conf;
        # SPA fallback: client-side routes (e.g. /invoices/hc_inv_…)
        # resolve to index.html.
        try_files $uri $uri/ /index.html;
    }
}
