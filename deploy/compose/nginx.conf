# Hardcount reverse proxy — single upstream, terminates HTTP at :80
#
# For HTTPS termination, run certbot or put a managed load balancer
# (ALB / Cloudflare) in front. This config is HTTP-only on purpose so
# the local quickstart works with `curl http://localhost/health` and
# operators add TLS the way that fits their infra.

# Docker's embedded DNS. With "resolve", nginx looks the containers up again
# when their address changes, so recreating hardcount-api (a new image, an
# upgrade) does not leave nginx sending to the old container's address
# until nginx is restarted. Needs nginx 1.27.3 or newer.
resolver 127.0.0.11 valid=10s ipv6=off;

# The access-log format that keeps link tokens out of the log.
# docker-compose.yml mounts this file. Run this config outside Compose, and
# it needs that file too.
include /etc/nginx/hardcount/nginx-log-redact.conf;

# A limit per client address, switched off. It bounds requests Hardcount
# refuses before counting them, such as ones with bad keys
# (docs/api/rate-limits.md). Usage ingest and the Stripe and Postmark
# webhooks get 2,000 a second, twice Hardcount's own ingest limit for one key,
# so one key sending from one address at Hardcount's default ingest rate meets
# Hardcount's 429 first, never this one. The rest of /v1, the event stream and
# /health included, gets 100 a second. To switch it on, uncomment the lines
# between each pair of "opt-in limit" markers in this file. Behind Caddy, a
# balancer or a CDN, the real-address lines in the server block must name it,
# or every client shares one bucket; with nothing in front of nginx, leave them
# commented (docs/production-one-vm.md#3-add-https-with-caddy).
# scripts/ci/nginx-config-check.sh checks the file with them uncommented.
# opt-in limit: begin
# map $uri $hc_v1_key {
#     ~^/v1/(usage-events|integrations/litellm|webhooks/) "";
#     default $binary_remote_addr;
# }
# map $uri $hc_ingest_key {
#     ~^/v1/(usage-events|integrations/litellm|webhooks/) $binary_remote_addr;
#     default "";
# }
# limit_req_zone $hc_v1_key zone=hc_v1:10m rate=100r/s;
# limit_req_zone $hc_ingest_key zone=hc_ingest:10m rate=2000r/s;
# limit_req_status 429;
# opt-in limit: end

upstream hardcount_api {
    zone hardcount_api 64k;
    server hardcount-api:8080 resolve;
    keepalive 32;
}

upstream hardcount_dashboard {
    zone hardcount_dashboard 64k;
    server hardcount-dashboard:80 resolve;
    keepalive 8;
}

server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/access.log hardcount_redacted;

    # The real client address, for the per-address limit above: the ranges of
    # the proxy in front (Docker's networks, for Caddy in this stack) and the
    # header it sets. With nothing in front of nginx, leave this pair
    # commented: a client that arrives through Docker's port proxy can appear
    # as the bridge gateway, inside these ranges, and then choose its counted
    # address with X-Forwarded-For. Switched on, it also changes the address
    # the /metrics allow list, the access log and X-Real-IP see.
    # opt-in limit: begin
    # set_real_ip_from 172.16.0.0/12;
    # set_real_ip_from 192.168.0.0/16;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;
    # opt-in limit: end

    # The dashboard's own nginx sends the security headers for its pages
    # (nginx-security-headers.conf), and the API sends its own. Adding them
    # here too would send each header twice.

    # Cap bodies at the API's own 1 MB limit. The LiteLLM route below takes
    # more.
    client_max_body_size 1m;

    # Proxy timeouts — strictly ABOVE the binary's 35s WriteTimeout
    # (cmd/hardcount/main.go), so the upstream always writes its clean 504
    # before nginx gives up. Equal values race → connection reset instead
    # of a response, the same trap the server avoids one tier down by
    # keeping WriteTimeout above the 30s middleware.Timeout.
    proxy_connect_timeout 5s;
    proxy_send_timeout 40s;
    proxy_read_timeout 40s;

    # Restrict /metrics to localhost + private RFC1918 ranges by default.
    # Operators routing Prometheus from outside should add their CIDR here.
    # This is a second layer only: behind a load balancer every caller has
    # a private address, so the API also requires the METRICS_TOKEN bearer
    # token in production (see .env.example).
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://hardcount_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE stream: buffering must be OFF and the read timeout long, or the
    # proxy holds/kills the event stream (the general 35s read timeout
    # above would sever it).
    location = /v1/webhook_events/stream {
        # The per-address limit counts each stream opened; a live stream is one
        # request, so the rate never touches it.
        # opt-in limit: begin
        # limit_req zone=hc_v1 burst=1000 nodelay;
        # opt-in limit: end
        proxy_pass http://hardcount_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # LiteLLM sends a whole batch of calls in one body, and the API reads up
    # to 32 MB on this route. The cap sits just above that, so a bigger body
    # gets the API's JSON 413 batch_too_large, not an nginx error page.
    location = /v1/integrations/litellm/spend {
        client_max_body_size 33m;
        # The per-address limit, switched off (top of this file).
        # opt-in limit: begin
        # limit_req zone=hc_v1 burst=1000 nodelay;
        # limit_req zone=hc_ingest burst=4000 nodelay;
        # opt-in limit: end
        proxy_pass http://hardcount_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API surfaces → the Go binary (the API registers /v1/*, /health,
    # /health/ready, /metrics only — there is no /docs route). Everything
    # else is the SPA, so the dashboard and the API share ONE origin (no
    # CORS, no build-time VITE_API_URL — the app falls back to
    # window.location.origin).
    location ~ ^/(v1/|health) {
        # The per-address limit, switched off (top of this file).
        # opt-in limit: begin
        # limit_req zone=hc_v1 burst=1000 nodelay;
        # limit_req zone=hc_ingest burst=4000 nodelay;
        # opt-in limit: end
        proxy_pass http://hardcount_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dashboard SPA (hardcount-dashboard container; SPA fallback handled by
    # its internal nginx).
    location / {
        proxy_pass http://hardcount_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
